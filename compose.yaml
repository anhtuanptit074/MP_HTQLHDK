name: htqlhdk-local

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${HTQLHDK_DB_NAME:?Set HTQLHDK_DB_NAME in .env.local}
      POSTGRES_USER: ${HTQLHDK_DB_ADMIN_USER:?Set HTQLHDK_DB_ADMIN_USER in .env.local}
      POSTGRES_PASSWORD: ${HTQLHDK_DB_ADMIN_PASSWORD:?Set HTQLHDK_DB_ADMIN_PASSWORD in .env.local}
      PGDATA: /var/lib/postgresql/17/docker
      TZ: UTC
    ports:
      - "127.0.0.1:${HTQLHDK_DB_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
