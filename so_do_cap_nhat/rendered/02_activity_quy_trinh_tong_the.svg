<text x="2080.0" y="1533" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#111827">Hoàn tất</text>
<text x="2080.0" y="1555" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#111827">không lỗi / timeout?</text>
<rect x="695" y="1490" width="430" height="110" rx="18" fill="#FEF2F2" stroke="#475569" stroke-width="3"/>
<text x="910.0" y="1528" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Đánh dấu Failed / Timed Out</text>
<text x="910.0" y="1554" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">hoặc Cancelled; xử lý ngoại lệ</text>
<rect x="1280" y="1690" width="430" height="110" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="1495.0" y="1728" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Thu báo cáo, kiểm SHA-256,</text>
<text x="1495.0" y="1754" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">định dạng, nguồn và phạm vi</text>
<polygon points="1495.0,1835.0 1660.0,1905 1495.0,1975.0 1330.0,1905" fill="#FFF7ED" stroke="#475569" stroke-width="3"/>
