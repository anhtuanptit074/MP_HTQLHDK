<text x="325.0" y="2248" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Xác nhận Final Severity</text>
<text x="325.0" y="2274" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và phân công khắc phục</text>
<rect x="695" y="2210" width="430" height="100" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="910.0" y="2248" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Sửa lỗi, cập nhật tiến độ</text>
<text x="910.0" y="2274" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và bằng chứng</text>
<rect x="1280" y="2360" width="430" height="100" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="1495.0" y="2398" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Tạo và điều phối</text>
<text x="1495.0" y="2424" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">lần quét xác minh</text>
<rect x="110" y="2360" width="430" height="100" rx="18" fill="#F0FDF4" stroke="#475569" stroke-width="3"/>
<text x="325.0" y="2398" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Đóng nếu coverage đạt;</text>
