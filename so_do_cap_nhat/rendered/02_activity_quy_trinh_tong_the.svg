<text x="910.0" y="1914" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và ghi lỗi tiếp nhận</text>
<rect x="1280" y="2070" width="430" height="110" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="1495.0" y="2108" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Lưu artifact, tạo import_batch,</text>
<text x="1495.0" y="2134" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">chuẩn hóa và chống trùng</text>
