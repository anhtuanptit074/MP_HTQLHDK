<rect x="110" y="270" width="430" height="92" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="325.0" y="308" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Khai báo tài sản, phạm vi</text>
<text x="325.0" y="334" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và khung giờ quét</text>
<rect x="110" y="410" width="430" height="92" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="325.0" y="448" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Xác nhận và phê duyệt</text>
<text x="325.0" y="474" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">tài sản / phạm vi</text>
<rect x="695" y="550" width="430" height="92" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="910.0" y="588" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Tạo hồ sơ quét ZAP</text>
<text x="910.0" y="614" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">có phiên bản</text>
<rect x="110" y="690" width="430" height="92" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="325.0" y="728" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Phê duyệt hồ sơ</text>
<text x="325.0" y="754" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và kích hoạt lịch</text>
<rect x="1280" y="830" width="430" height="92" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="1495.0" y="868" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Phát hiện lịch đến hạn</text>
<text x="1495.0" y="894" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và tạo scan_occurrence</text>
<polygon points="1495.0,975.0 1675.0,1050 1495.0,1125.0 1315.0,1050" fill="#FFF7ED" stroke="#475569" stroke-width="3"/>
<text x="1495.0" y="1034" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#111827">Asset, scope, profile</text>
<text x="1495.0" y="1056" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#111827">và khung giờ hợp lệ?</text>
<rect x="695" y="980" width="430" height="100" rx="18" fill="#FEF2F2" stroke="#475569" stroke-width="3"/>
<text x="910.0" y="1018" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Ghi Missed/Failed</text>
<text x="910.0" y="1044" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và rà soát ngoại lệ</text>
<rect x="1280" y="1180" width="430" height="92" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="1495.0" y="1218" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Tạo zap_execution</text>
<text x="1495.0" y="1244" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và snapshot cấu hình</text>
<rect x="1865" y="1320" width="430" height="110" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
<text x="2080.0" y="1358" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">Chạy spider, passive scan</text>
<text x="2080.0" y="1384" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#111827">và active scan nếu được duyệt</text>
