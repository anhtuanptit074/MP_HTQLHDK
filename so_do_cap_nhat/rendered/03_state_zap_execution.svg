<text x="300" y="1133" text-anchor="start" font-family="Arial" font-size="23" font-weight="700" fill="#2563EB">Ràng buộc chuyển trạng thái</text>
<text x="300" y="1181" text-anchor="start" font-family="Arial" font-size="21" font-weight="400" fill="#111827">• Chỉ Report Received mới liên kết import_batch và hoàn tất scan_occurrence.</text>
<text x="300" y="1212" text-anchor="start" font-family="Arial" font-size="21" font-weight="400" fill="#111827">• Failed, Timed Out và Cancelled phải có finished_at; lỗi phải có failure_code đã che dữ liệu nhạy cảm.</text>
<text x="300" y="1243" text-anchor="start" font-family="Arial" font-size="21" font-weight="400" fill="#111827">• Không tự retry một phiên đã bắt đầu gửi request; chạy lại phải tạo phiên mới theo thẩm quyền.</text>
<text x="300" y="1274" text-anchor="start" font-family="Arial" font-size="21" font-weight="400" fill="#111827">• Lease/heartbeat hết hạn chuyển sang Failed hoặc Timed Out để tránh quét trùng âm thầm.</text>
