.366 L446.481,552.366" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M785.42,552.366 L785.42,562.366 L795.42,562.366 L785.42,552.366" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="452.481" y="569.56" fill="#000" font-size="13" textLength="294.715" font-family="Arial">Sự kiện: lịch sắp đến hạn / bỏ lỡ; lô Failed / Partial;</text><text x="452.481" y="584.509" fill="#000" font-size="13" textLength="306.966" font-family="Arial">Finding Critical / High; phiếu mới / sắp hạn / quá hạn;</text><text x="452.481" y="599.458" fill="#000" font-size="13" textLength="327.939" font-family="Arial">yêu cầu xác minh; đề nghị rủi ro chờ duyệt / sắp hết hạn.</text><text x="452.481" y="614.406" fill="#000" font-size="13" textLength="281.722" font-family="Arial">Không tự tích hợp email, BI hay ticket bên ngoài.</text><polygon points="217.645,622.161,434.481,622.161,446.481,634.161,434.481,646.161,217.645,646.161,205.645,634.161,217.645,622.161" fill="#FFF7ED" style="stroke:#9A3412;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217.645" y="638.881" fill="#000" font-size="13" textLength="216.836" font-family="Arial">Có sự kiện thông báo thuộc mục 9.1?</text><text x="189.027" y="631.406" fill="#000" font-size="13" textLength="16.618" font-family="Arial">Có</text><text x="446.481" y="631.406" fill="#000" font-size="13" textLength="37.591" font-family="Arial">Không</text><rect x="29.655" y="656.161" width="306.787" height="34.949" fill="#EFF6FF" style="stroke:#334155;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="39.655" y="678.355" fill="#000" font-size="13" textLength="286.787" font-family="Arial">Xác định người liên quan theo nhiệm vụ / phạm vi</text><rect x="67.176" y="711.11" width="231.745" height="64.846" fill="#EFF6FF" style="stroke:#334155;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="77.176" y="733.304" fill="#000" font-size="13" textLength="211.745" font-family="Arial">Thông báo mã tài sản, mã phát hiện,</text><text x="77.176" y="748.253" fill="#000" font-size="13" textLength="198.745" font-family="Arial">trạng thái và liên kết vào hệ thống;</text><text x="77.176" y="763.201" fill="#000" font-size="13" textLength="209.568" font-family="Arial">Không Attack, Evidence hoặc bí mật</text><rect x="356.442" y="656.161" width="225.271" height="34.949" fill="#EFF6FF" style="stroke:#334155;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="366.442" y="678.355" fill="#000" font-size="13" textLength="205.271" font-family="Arial">Không tạo thông báo ngoài phạm vi</text><polygon points="326.063,781.956,338.063,793.956,326.063,805.956,314.063,793.956,326.063,781.956" fill="#FFF7ED" style="stroke:#9A3412;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="326.063" cy="836.956" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="326.063" cy="836.956" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="53.354" x2="20" y2="847.956" style="stroke:#000;stroke-width:1.5;"/><rect x="806.42" y="217.725" width="319.527" height="49.897" fill="#EFF6FF" style="stroke:#334155;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="816.42" y="239.919" fill="#000" font-size="13" textLength="258.432" font-family="Arial">Xác định người / hạn mới theo Final Severity</text><text x="816.42" y="254.868" fill="#000" font-size="13" textLength="299.527" font-family="Arial">và bảng thời hạn được đơn vị phê duyệt; nhập lý do</text><line x1="800.42" y1="53.354" x2="800.42" y2="847.956" style="stroke:#000;stroke-width:1.5;"/><line x1="1129.947" y1="53.354" x2="1129.947" y2="847.956" style="stroke:#000;stroke-width:1.5;"/><line x1="326.063" y1="93.302" x2="326.063" y2="113.302" style="stroke:#334155;stroke-width:1;"/><polygon points="322.063,103.302,326.063,113.302,330.063,103.302,326.063,107.302" fill="#334155" style="stroke:#334155;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="486.769" y1="371.52" x2="486.769" y2="406.469" 