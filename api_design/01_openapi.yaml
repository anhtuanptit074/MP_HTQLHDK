      tags: [Notifications]
      operationId: listNotifications
      summary: Hộp thông báo của người dùng
      x-use-cases: [UC-C08]
      x-contract:
        purpose: Trả thông báo tối thiểu của chính người nhận.
        actors: [SECURITY, OWNER, SCAN_OPS, REMEDIATOR, RISK_APPROVER]
        scope: recipient_id là current user và quyền asset hiện hành; revoked grant không lộ chi tiết.
        state: Không đổi.
        transaction: Read-only recipient-filtered query.
        concurrency: Cursor by created_at/id.
        audit: Không audit mỗi read; denial audit.
        tests: [own only, revoked asset, no sensitive content, cursor]
      parameters: [{$ref: '#/components/parameters/PageAfter'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResources'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Đánh dấu thông báo đã đọc
      x-use-cases: [UC-C08]
      x-contract:
        purpose: Ghi trạng thái đọc của chính người nhận.
        actors: [authenticated recipient]
        scope: notification.recipient_id=current user; không chấp nhận IDOR.
        state: Unread→Read, idempotent.
        transaction: Lock notification; set read_at once; commit.
        concurrency: Idempotency; first timestamp preserved.
        audit: Không cần business audit success; IDOR denial audit.
        tests: [recipient, other recipient denied, repeat preserves timestamp]
      parameters: [{$ref: '#/components/parameters/NotificationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Đã đọc, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.example.invalid/.well-known/openid-configuration
      description: Placeholder cấu hình; issuer thực tế phải được đơn vị phê duyệt.
  headers:
    ETag:
      description: Phiên bản tài nguyên dạng chuỗi có dấu nháy.
      schema: {type: string, example: '"7"'}
    CorrelationId:
      description: UUID truy vết request/audit.
      schema: {type: string, format: uuid}
  parameters:
    AssetId: {name: assetId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ScopeId: {name: scopeId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ScheduleId: {name: scheduleId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ScanId: {name: scanId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ImportId: {name: importId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    FindingId: {name: findingId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    TicketId: {name: ticketId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    VerificationRequestId: {name: verificationRequestId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    EvidenceId: {name: evidenceId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    RiskAcceptanceId: {name: riskAcceptanceId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ExportId: {name: exportId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    GrantId: {name: grantId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[^"\\r\\n]+"$'}, description: Strong opaque ETag; Finding normally uses its numeric row_version.}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    AccessReason: {name: X-Access-Reason, in: header, required: true, schema: {type: string, minLength: 3, maxLength: 500}}
    DownloadToken: {name: X-Download-Token, in: header, required: false, schema: {type: string, minLength: 32, maxLength: 512}, description: Token ngẫu nhiên khi luồng phát hành yêu cầu; không log và không thay thế authorization.}
    PageAfter: {name: 'page[after]', in: query, required: false, schema: {type: string, maxLength: 2048}}
    PageSize: {name: 'page[size]', in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  responses:
    PagedResources: {description: Trang dữ liệu đã lọc, headers: {X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/PagedResources'}}}}
    Unauthorized: {description: Chưa xác thực, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Forbidden: {description: Không đủ quyền/phạm vi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    NotFound: {description: Không tìm thấy trong phạm vi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Gone: {description: Đã hết hạn/thu hồi, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Conflict: {description: Trùng hoặc sai trạng thái, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PreconditionFailed: {description: ETag/row version cũ, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unprocessable: {description: Vi phạm quy tắc nghiệp vụ, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    PayloadTooLarge: {description: Vượt giới hạn cấu hình, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    UnsupportedMedia: {description: Định dạng không hỗ trợ, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    Unavailable: {description: Phụ thuộc tạm lỗi hoặc audit bắt buộc không ghi được, headers: {Retry-After: {schema: {type: integer}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, correlationId, retryable]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string, pattern: '^[A-Z]+-[0-9]{3}$'}
        detail: {type: string}
        correlationId: {type: string, format: uuid}
        retryable: {type: boolean}
        errors: {type: array, items: {type: object, properties: {field: {type: string}, code: {type: string}}}}
    Resource:
      type: object
      required: [id, version]
      properties:
        id: {type: integer, format: int64}
        version: {type: string, description: Opaque representation version used to form ETag; Finding derives it from row_version.}
        status: {type: string}
        links: {type: object, additionalProperties: {type: string, format: uri-reference}}
      additionalProperties: true
    PagedResources:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Resource'}}
        page:
          type: object
          required: [size]
          properties: {size: {type: integer}, next: {type: [string, 'null']}}
    UserContext:
      type: object
      required: [userId, displayName, grants]
      properties:
        userId: {type: integer, format: int64}
        displayName: {type: string}
        grants: {type: array, items: {type: object, required: [role, permissions], properties: {role: {type: string}, assetId: {type: [integer, 'null'], format: int64}, permissions: {type: array, items: {type: string}}, canReadRawReport: {type: boolean}, canReadSensitiveEvidence: {type: boolean}}}}
    AssetCreate:
      type: object
      required: [code, name, domain, baseUrl, environment]
      properties: {code: {type: string, minLength: 1, maxLength: 40}, name: {type: string, minLength: 1, maxLength: 300}, domain: {type: string, minLength: 1, maxLength: 253}, baseUrl: {type: string, format: uri}, environment: {type: string, minLength: 1, maxLength: 100}, ownerId: {type: [integer, 'null'], format: int64}, technicalTeamId: {type: [integer, 'null'], format: int64}, securityOfficerId: {type: [integer, 'null'], format: int64}, criticality: {type: [string, 'null']}, dataClassification: {type: [string, 'null']}, internetExposed: {type: [boolean, 'null']}, unitName: {type: [string, 'null']}}
      additionalProperties: false
    AssetUpdate:
      type: object
      properties: {name: {type: string, minLength: 1, maxLength: 300}, domain: {type: string, minLength: 1, maxLength: 253}, baseUrl: {type: string, format: uri}, environment: {type: string, minLength: 1, maxLength: 100}, ownerId: {type: [integer, 'null'], format: int64}, technicalTeamId: {type: [integer, 'null'], format: int64}, securityOfficerId: {type: [integer, 'null'], format: int64}, criticality: {type: [string, 'null']}, dataClassification: {type: [string, 'null']}, internetExposed: {type: [boolean, 'null']}, unitName: {type: [string, 'null']}}
      additionalProperties: false
    Asset:
      allOf:
        - {$ref: '#/components/schemas/Resource'}
        - {type: object, required: [code, name, status], properties: {code: {type: string}, name: {type: string}, baseUrlMasked: {type: string}, status: {type: string, enum: [Draft, Pending Approval, Active, Suspended, Retired]}, currentScopeId: {type: [integer, 'null'], format: int64}}}
    AccessGrantInput:
      type: object
      required: [userId, roleCode]
      properties: {userId: {type: integer, format: int64}, roleCode: {type: string, enum: [ADMIN, SECURITY, OWNER, SCAN_OPS, REMEDIATOR, RISK_APPROVER, AUDITOR]}, assetId: {type: [integer, 'null'], format: int64}, canReadRawReport: {type: boolean, default: false}, canReadSensitiveEvidence: {type: boolean, default: false}, sensitiveReason: {type: [string, 'null'], maxLength: 500}}
      additionalProperties: false
    ReasonInput:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 1, maxLength: 2000}}
      additionalProperties: false
    DecisionInput:
      type: object
      required: [decision, reason]
      properties: {decision: {type: string, enum: [Approve, Reject]}, reason: {type: string, minLength: 1, maxLength: 2000}}
      additionalProperties: false
    TransitionInput:
      type: object
      required: [toStatus, reason]
      properties: {toStatus: {type: string}, reason: {type: string, minLength: 1, maxLength: 2000}}
      additionalProperties: false
    ScopeRevisionInput:
      type: object
      required: [rules, windows]
      properties:
        baseRevisionId: {type: [integer, 'null'], format: int64}
        rules: {type: array, minItems: 1, maxItems: 10000, items: {type: object, required: [kind, pattern], properties: {kind: {type: string, enum: [Include, Exclude]}, pattern: {type: string, minLength: 1, maxLength: 2000}}, additionalProperties: false}}
        windows: {type: array, minItems: 1, items: {type: object, required: [timezone, daysOfWeek, startTime, endTime], properties: {timezone: {type: string}, daysOfWeek: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 7}}, startTime: {type: string, format: time}, endTime: {type: string, format: time}}, additionalProperties: false}}
      additionalProperties: false
    ScheduleInput:
      type: object
      required: [code, name, scopeId, frequency, recurrence, timezone, effectiveFrom, nextDueAt, plannedDurationMinutes, operationsTeamId, targetUrls]
      properties: {code: {type: string, minLength: 1, maxLength: 40}, name: {type: string, minLength: 1, maxLength: 300}, scopeId: {type: integer, format: int64}, frequency: {type: string, enum: [Daily, Weekly, Monthly, Custom]}, recurrence: {type: string, minLength: 1, maxLength: 1000}, timezone: {type: string}, effectiveFrom: {type: string, format: date-time}, effectiveUntil: {type: [string, 'null'], format: date-time}, nextDueAt: {type: string, format: date-time}, plannedDurationMinutes: {type: integer, minimum: 1}, operationsTeamId: {type: integer, format: int64}, targetUrls: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uri}}, zapConfigNote: {type: [string, 'null'], maxLength: 4000}}
      additionalProperties: false
    ScanOccurrenceInput:
      type: object
      required: [plannedAt, plannedEndAt, targetUrls]
      properties: {plannedAt: {type: string, format: date-time}, plannedEndAt: {type: string, format: date-time}, targetUrls: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uri}}, configSnapshotMasked: {type: [string, 'null'], maxLength: 4000}}
      additionalProperties: false
    ScanTransitionInput:
      allOf:
        - {$ref: '#/components/schemas/TransitionInput'}
        - {type: object, properties: {startedAt: {type: string, format: date-time}, completedAt: {type: string, format: date-time}}}
    ImportBatch:
      allOf:
        - {$ref: '#/components/schemas/Resource'}
        - {type: object, required: [assetId, scanId, format, status, counts], properties: {assetId: {type: integer, format: int64}, scanId: {type: integer, format: int64}, format: {type: string, enum: [Traditional JSON, Traditional XML]}, status: {type: string, enum: [Received, Validating, Processing, Completed, Partially Completed, Rejected, Failed]}, counts: {type: object, properties: {total: {type: integer}, succeeded: {type: integer}, failed: {type: integer}}}}}
    Finding:
      allOf:
        - {$ref: '#/components/schemas/Resource'}
        - {type: object, required: [assetId, code, status], properties: {assetId: {type: integer, format: int64}, code: {type: string}, titleMasked: {type: string}, sourceRisk: {type: [string, 'null']}, sourceConfidence: {type: [string, 'null']}, finalSeverity: {type: [string, 'null']}, status: {type: string, enum: [New, Triaged, Assigned, In Progress, Pending Verification, Closed, Reopened, False Positive, Pending Risk Acceptance, Risk Accepted, Cancelled]}}}
    FindingReviewInput:
      type: object
      required: [kind, reason]
      properties: {kind: {type: string, enum: [Severity, False Positive, Cancelled, Recheck]}, proposedSeverity: {type: [string, 'null'], enum: [Informational, Low, Medium, High, Critical, null]}, reason: {type: string, minLength: 1, maxLength: 4000}, contextMasked: {type: [string, 'null'], maxLength: 8000}, evidenceId: {type: [integer, 'null'], format: int64}}
      additionalProperties: false
    ImpactConfirmationInput:
      type: object
      required: [contextMasked]
      properties: {contextMasked: {type: string, minLength: 1, maxLength: 8000}}
      additionalProperties: false
    TicketEventInput:
      type: object
      required: [eventType, previousEventId, reason]
      properties: {eventType: {type: string, enum: [Assignment, Progress, Deadline]}, previousEventId: {type: [integer, 'null'], format: int64}, assigneeId: {type: [integer, 'null'], format: int64}, teamId: {type: [integer, 'null'], format: int64}, dueAt: {type: [string, 'null'], format: date-time}, slaRuleId: {type: [integer, 'null'], format: int64}, progressPercent: {type: [integer, 'null'], minimum: 0, maximum: 100}, remediationMasked: {type: [string, 'null'], maxLength: 8000}, evidenceId: {type: [integer, 'null'], format: int64}, reason: {type: string, minLength: 1, maxLength: 2000}}
      additionalProperties: false
    VerificationRequestInput:
      type: object
      required: [ticketEventId, operationsTeamId, scopeNote]
      properties: {ticketEventId: {type: integer, format: int64}, operationsTeamId: {type: integer, format: int64}, scopeNote: {type: string, minLength: 1, maxLength: 4000}}
      additionalProperties: false
    VerificationDecisionInput:
      type: object
      required: [scanId, importId, outcome, isValid, coverageConfirmed, fingerprintPresent, reason]
      properties: {scanId: {type: integer, format: int64}, importId: {type: integer, format: int64}, outcome: {type: string, enum: [Closed, Reopened]}, isValid: {type: boolean}, coverageConfirmed: {type: boolean}, fingerprintPresent: {type: boolean}, reason: {type: string, minLength: 1, maxLength: 4000}, evidenceId: {type: [integer, 'null'], format: int64}}
      additionalProperties: false
    RiskAcceptanceInput:
      type: object
      required: [reasonMasked, impactMasked, mitigationMasked, responsibleUserId, proposedUntil]
      properties: {reasonMasked: {type: string, minLength: 1, maxLength: 8000}, impactMasked: {type: string, minLength: 1, maxLength: 8000}, mitigationMasked: {type: string, minLength: 1, maxLength: 8000}, responsibleUserId: {type: integer, format: int64}, proposedUntil: {type: string, format: date-time}}
      additionalProperties: false
    RiskAcceptancePatch:
      type: object
      minProperties: 1
      properties: {reasonMasked: {type: string, minLength: 1, maxLength: 8000}, impactMasked: {type: string, minLength: 1, maxLength: 8000}, mitigationMasked: {type: string, minLength: 1, maxLength: 8000}, responsibleUserId: {type: integer, format: int64}, proposedUntil: {type: string, format: date-time}}
      additionalProperties: false
    RiskDecisionInput:
      type: object
      oneOf:
        - type: object
          required: [decision, reason]
          properties: {decision: {const: Needs Information}, reason: {type: string, minLength: 1, maxLength: 4000}}
          additionalProperties: false
        - type: object
          required: [decision, reason, authorityRef, conditionsMasked, validFrom, validUntil]
          properties: {decision: {const: Approve}, reason: {type: string, minLength: 1, maxLength: 4000}, authorityRef: {type: string, minLength: 1, maxLength: 500}, conditionsMasked: {type: string, minLength: 1, maxLength: 8000}, validFrom: {type: string, format: date-time}, validUntil: {type: string, format: date-time}}
          additionalProperties: false
        - type: object
          required: [decision, reason, authorityRef]
          properties: {decision: {const: Reject}, reason: {type: string, minLength: 1, maxLength: 4000}, authorityRef: {type: string, minLength: 1, maxLength: 500}}
          additionalProperties: false
    ReportExportInput:
      type: object
      required: [assetIds, recipientUserId, reportType, format, maskingPolicyRef, expiresAt]
      properties: {assetIds: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, format: int64}}, recipientUserId: {type: integer, format: int64}, reportType: {type: string, minLength: 1, maxLength: 200}, format: {type: string, enum: [PDF, CSV]}, maskingPolicyRef: {type: string, minLength: 1, maxLength: 500}, expiresAt: {type: string, format: date-time}, filters: {type: object, additionalProperties: true}}
      additionalProperties: false
