openapi: 3.1.0
info:
  title: HTQLHDK API
  version: 1.0.0
  description: >-
    Hợp đồng API giai đoạn 8 cho F-01..F-04. OWASP ZAP chạy bên ngoài;
    API không cung cấp năng lực điều khiển scanner. Mọi dữ liệu thông thường đã che.
servers:
  - url: /api/v1
security:
  - oidc: []
tags:
  - {name: Context}
  - {name: Access}
  - {name: Assets}
  - {name: Schedules}
  - {name: Imports}
  - {name: Findings}
  - {name: Tickets}
  - {name: Verification}
  - {name: Risk}
  - {name: Reports}
  - {name: Audit}
  - {name: Notifications}
x-api-rules:
  authorization: Default deny; permission + active asset grant + owner/task scope checked server-side per request.
  masking: Ordinary endpoints return masked data only; raw/evidence/export content uses separate audited streams.
  concurrency: Mutations of versioned resources require If-Match; replayable creates/actions require Idempotency-Key.
  transactions: Success audit is atomic with business writes; denial/failure audit uses an independent transaction.
  time: RFC 3339 UTC; schedule timezone is an IANA identifier.
x-internal-processes:
  - id: import-validate-normalize
    useCases: [UC-I02, UC-I03, UC-I04, UC-I05, UC-I06, UC-I07, UC-I08, UC-I09, UC-I10, UC-I11]
    trigger: Durable worker claims an ImportBatch created by createImport.
  - id: schedule-due-and-missed
    useCases: [UC-S05, UC-S07]
    trigger: Durable worker claims due schedules; it never starts ZAP.
  - id: risk-expiry
    useCases: [UC-RA05, UC-RA06]
    trigger: Durable worker evaluates applied approvals and reopens when expiry/condition/risk rules require it.
  - id: deadline-notification
    useCases: [UC-R12, UC-C08]
    trigger: Durable worker creates minimal in-app notifications from approved policy.

paths:
  /context:
    get:
      tags: [Context]
      operationId: getCurrentContext
      summary: Lấy danh tính và quyền hiệu lực của người dùng
      x-use-cases: [UC-C09]
      x-contract:
        purpose: Phục vụ Auth/context và không coi claim IdP là quyền nghiệp vụ.
        actors: [authenticated]
        scope: Chỉ trả grant chưa thu hồi của chính người dùng; assetId null không phải wildcard.
        state: Không đổi trạng thái.
        transaction: Read-only snapshot app_user, user_role và v_role_permission.
        concurrency: Quyền được đọc lại mỗi request; không cache qua request.
        audit: Không audit mỗi lần lấy context; auth denial được audit theo policy.
        tests: [inactive user, revoked grant, null asset not wildcard]
      responses:
        '200': {description: Ngữ cảnh hiện hành, content: {application/json: {schema: {$ref: '#/components/schemas/UserContext'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /access-grants:
    post:
      tags: [Access]
      operationId: createAccessGrant
      summary: Gán vai trò, asset scope và quyền nhạy cảm
      x-use-cases: [UC-C01, UC-C07]
      x-contract:
        purpose: Cấp quyền hỗ trợ F-01..F-04.
        actors: [ADMIN]
        scope: ADMIN quản lý grant nhưng không nhờ đó đọc dữ liệu asset; grant nhạy cảm bắt buộc asset cụ thể và lý do.
        state: Tạo grant Active; không sửa grant cũ để tạo lịch sử giả.
        transaction: Lock app_user và asset nếu có; insert user_role; insert Permission audit; commit.
        concurrency: Unique active-grant conflict trả grant hiện có hoặc CON-003.
        audit: access.grant Success/Denied/Failure, before null, after đã che.
        tests: [admin success, non-admin denied, sensitive without asset rejected, duplicate concurrent]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccessGrantInput'}}}}
      responses:
        '201': {description: Grant đã tạo, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /access-grants/{grantId}/revoke:
    post:
      tags: [Access]
      operationId: revokeAccessGrant
      summary: Thu hồi quyền
      x-use-cases: [UC-C02, UC-C07]
      x-contract:
        purpose: Thu hồi có hiệu lực từ request kế tiếp.
        actors: [ADMIN]
        scope: Chỉ quản lý grant; không mở quyền dữ liệu asset cho ADMIN.
        state: Active sang Revoked; không hard delete.
        transaction: Lock user_role; set revoked_at/by/reason; audit; commit.
        concurrency: If-Match bắt buộc; grant đã thu hồi trả STATE-001 hoặc replay result.
        audit: access.revoke với before/after đã che.
        tests: [success, stale version, already revoked, denial audit]
      parameters:
        - {$ref: '#/components/parameters/GrantId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonInput'}}}}
      responses:
        '200': {description: Grant đã thu hồi, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '409': {$ref: '#/components/responses/Conflict'}

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: Danh sách tài sản trong phạm vi
      x-use-cases: [UC-A07, UC-C09]
      x-contract:
        purpose: Worklist tài sản đã lọc quyền.
        actors: [SECURITY, OWNER, SCAN_OPS, REMEDIATOR, RISK_APPROVER, AUDITOR]
        scope: Active asset grant; OWNER đúng owner; REMEDIATOR có ticket hiện hành.
        state: Không đổi trạng thái.
        transaction: Read-only; query bắt đầu từ authorized asset IDs.
        concurrency: Cursor gồm sort key và id; snapshot không cam kết giữa các trang.
        audit: Chỉ audit khi policy coi truy vấn là nhạy cảm; denial luôn audit.
        tests: [cross-asset IDOR, revoked grant, stable cursor, masking]
      parameters: [{$ref: '#/components/parameters/PageAfter'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResources'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Khai báo Asset Draft
      x-use-cases: [UC-A01]
      x-contract:
        purpose: Tạo định danh tài sản và dữ liệu khai báo ban đầu.
        actors: [SECURITY, OWNER]
        scope: SECURITY/OWNER phải có quyền declare; OWNER tạo cho chính mình theo policy.
        state: null sang Draft.
        transaction: Validate normalized asset code/base URL; insert asset; audit; commit.
        concurrency: Idempotency key và unique asset code; bên thua nhận AST-001/CON-003.
        audit: asset.create, after không chứa bí mật.
        tests: [success, duplicate, invalid URL, idempotent replay, denied]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetCreate'}}}}
      responses:
        '201': {description: Asset Draft, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Xem chi tiết tài sản đã che
      x-use-cases: [UC-A07, UC-C09]
      x-contract:
        purpose: Trả Asset, scope hiện hành và thông tin hỗ trợ tối thiểu.
        actors: [SECURITY, OWNER, SCAN_OPS, REMEDIATOR, RISK_APPROVER, AUDITOR]
        scope: Permission asset.read + asset/task scope; chống IDOR trước load chi tiết.
        state: Không đổi trạng thái.
        transaction: Read-only consistent query.
        concurrency: Response có ETag từ row_version.
        audit: Denied audit; dữ liệu thông thường không chứa object/key/raw.
        tests: [in-scope, out-of-scope, masked fields]
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      responses:
        '200': {description: Asset, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Cập nhật thông tin Asset
      x-use-cases: [UC-A02]
      x-contract:
        purpose: Sửa trường được phép; thay đổi ảnh hưởng scope cần revision mới/phê duyệt lại.
        actors: [SECURITY, OWNER]
        scope: asset.update trên đúng asset; OWNER đúng owner.
        state: Giữ Draft/Pending Approval hoặc cập nhật metadata được policy cho phép; không sửa Retired.
        transaction: Lock asset; validate state/version; update allowlist fields; audit; commit.
        concurrency: If-Match bắt buộc.
        audit: asset.update before/after đã che.
        tests: [draft update, forbidden field, stale ETag, retired rejected]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/AssetUpdate'}}}}
      responses:
        '200': {description: Asset đã cập nhật, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /assets/{assetId}/scopes:
    post:
      tags: [Assets]
      operationId: createScopeRevision
      summary: Tạo phiên bản phạm vi Draft
      x-use-cases: [UC-A01, UC-A02]
      x-contract:
        purpose: Tạo revision gồm Include/Exclude và khung giờ; không sửa scope kết luận.
        actors: [SECURITY, OWNER]
        scope: asset.update trên đúng asset; OWNER đúng owner.
        state: null sang Draft; baseRevision nếu có phải cùng asset.
        transaction: Lock asset; allocate revision; insert scope/rules/windows; audit; commit.
        concurrency: Idempotency + unique asset/revision; không overwrite revision cạnh tranh.
        audit: asset.scope.create với nội dung đã chuẩn hóa/che.
        tests: [include required, invalid IANA timezone, cross-asset base, concurrent create]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScopeRevisionInput'}}}}
      responses:
        '201': {description: Scope Draft, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /assets/{assetId}/scopes/{scopeId}:
    put:
      tags: [Assets]
      operationId: updateScopeRevision
      summary: Sửa scope Draft
      x-use-cases: [UC-A02]
      x-contract:
        purpose: Thay toàn bộ snapshot rule/window của revision Draft.
        actors: [SECURITY, OWNER]
        scope: asset.update, assetId/scopeId cùng tài sản; OWNER đúng owner.
        state: Chỉ Draft; Approved/Rejected bất biến.
        transaction: Lock asset rồi scope; replace children in stable order; audit; commit.
        concurrency: If-Match bắt buộc; stale trả CON-002.
        audit: asset.scope.update before/after đã che.
        tests: [draft success, approved immutable, stale version, exclude precedence]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/ScopeId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScopeRevisionInput'}}}}
      responses:
        '200': {description: Scope đã sửa, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /assets/{assetId}/scopes/{scopeId}/submit:
    post:
      tags: [Assets]
      operationId: submitScopeRevision
      summary: Gửi scope để Owner xác nhận/phê duyệt
      x-use-cases: [UC-A01, UC-A02]
      x-contract:
        purpose: Gửi snapshot Draft cho Owner xác nhận mà chưa áp dụng scope.
        actors: [SECURITY, OWNER]
        scope: asset.update trên cùng asset; OWNER đúng owner.
        state: Scope và Asset giữ Draft; tạo dấu vết gửi/audit và thông báo tối thiểu vì DB không có trạng thái Awaiting Owner Confirmation.
        transaction: Lock asset/scope; validate rules/windows; insert audit submit; commit; enqueue notification idempotent.
        concurrency: If-Match + idempotency; chỉ một transition thắng.
        audit: asset.scope.submit from/to.
        tests: [complete scope, missing include, stale version, duplicate submit]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/ScopeId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonInput'}}}}
      responses:
        '200': {description: Scope Pending Approval, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /assets/{assetId}/scopes/{scopeId}/confirm:
    post:
      tags: [Assets]
      operationId: confirmScopeRevision
      summary: Owner xác nhận thông tin/phạm vi
      x-use-cases: [UC-A03]
      x-contract:
        purpose: Ghi xác nhận Owner trước quyết định SECURITY.
        actors: [OWNER]
        scope: asset.confirm; actor là owner hiện hành của asset.
        state: Scope Draft→Pending Approval; với tài sản mới Asset Draft→Pending Approval; thay đổi scope của Asset Active giữ Asset Active và scope cũ tiếp tục hiện hành.
        transaction: Lock asset/scope; validate ownership/content; set confirmed_by/at and scope state; update new asset state when applicable; audit; commit.
        concurrency: If-Match; xác nhận lặp cùng key trả kết quả cũ.
        audit: asset.scope.confirm.
        tests: [owner success, other owner denied, incomplete scope, concurrent edit]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/ScopeId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonInput'}}}}
      responses:
        '200': {description: Đã xác nhận, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /assets/{assetId}/scopes/{scopeId}/decision:
    post:
      tags: [Assets]
      operationId: decideScopeRevision
      summary: SECURITY phê duyệt hoặc từ chối scope
      x-use-cases: [UC-A04]
      x-contract:
        purpose: Kết luận scope và cập nhật scope hiện hành khi Approved.
        actors: [SECURITY]
        scope: asset.approve trên đúng asset.
        state: Scope Pending Approval→Approved/Rejected; approve tài sản mới làm Asset Pending Approval→Active, reject làm Asset Pending Approval→Draft; với thay đổi scope, Asset giữ trạng thái hiện hành và scope cũ nếu reject.
        transaction: Lock asset rồi scope; validate owner confirmation; set decision; approve atomically sets current_scope_id/new Asset Active, reject restores new Asset Draft; audit; commit.
        concurrency: If-Match; chỉ một quyết định thắng.
        audit: asset.scope.decision with from/to/reason.
        tests: [approve, reject, owner missing, stale, competing decisions]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/ScopeId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DecisionInput'}}}}
      responses:
        '200': {description: Quyết định đã ghi, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /assets/{assetId}/transitions:
    post:
      tags: [Assets]
      operationId: transitionAsset
      summary: Kích hoạt, tạm dừng, tiếp tục hoặc ngừng tài sản
      x-use-cases: [UC-A05, UC-A06, UC-A02]
      x-contract:
        purpose: Quản lý vòng đời không xóa cứng.
        actors: [SECURITY]
        scope: asset.update trên đúng asset.
        state: Active↔Suspended; Active/Suspended→Retired; không hồi sinh Retired. Pending Approval→Active chỉ xảy ra trong decideScopeRevision.
        transaction: Lock asset/current scope/schedules; validate target; update asset and pause affected schedules when required; audit; commit.
        concurrency: If-Match; stable lock order asset then schedules.
        audit: asset.transition with from/to/reason.
        tests: [activate guard, suspend cascaded pause, retire, invalid edge, stale]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransitionInput'}}}}
      responses:
        '200': {description: Asset sau chuyển trạng thái, content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}

  /assets/{assetId}/schedules:
    get:
      tags: [Schedules]
      operationId: listAssetSchedules
      summary: Danh sách lịch của tài sản
      x-use-cases: [UC-S05, UC-C09]
      x-contract:
        purpose: Theo dõi lịch và kỳ đến hạn trong phạm vi.
        actors: [SECURITY, OWNER, SCAN_OPS, REMEDIATOR, RISK_APPROVER, AUDITOR]
        scope: schedule.read + asset/task scope.
        state: Không đổi trạng thái.
        transaction: Read-only filtered query.
        concurrency: Cursor ổn định.
        audit: Denied audit; response đã che.
        tests: [scope filtering, due filter, cursor]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/PageAfter'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResources'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Tạo lịch quét Draft
      x-use-cases: [UC-S01]
      x-contract:
        purpose: Khai báo lịch cho ZAP được vận hành bên ngoài.
        actors: [SECURITY]
        scope: schedule.manage trên asset.
        state: null sang Draft; không khởi chạy scanner.
        transaction: Lock asset/current scope; validate target/timezone/window; insert schedule; audit; commit.
        concurrency: Idempotency; duplicate business key trả conflict.
        audit: schedule.create.
        tests: [active asset, outside scope, invalid timezone, duplicate]
      parameters: [{$ref: '#/components/parameters/AssetId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScheduleInput'}}}}
      responses:
        '201': {description: Lịch Draft, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /schedules/{scheduleId}:
    put:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Cập nhật lịch
      x-use-cases: [UC-S02]
      x-contract:
        purpose: Sửa snapshot lịch theo cạnh cho phép.
        actors: [SECURITY]
        scope: schedule.manage trên asset của lịch.
        state: Draft/Paused được sửa; thay đổi material khi Active buộc pause/phê duyệt lại theo policy.
        transaction: Lock asset then schedule; validate scope/window; update; audit; commit.
        concurrency: If-Match bắt buộc.
        audit: schedule.update before/after.
        tests: [draft edit, active restricted edit, stale, out-of-scope target]
      parameters: [{$ref: '#/components/parameters/ScheduleId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/ScheduleInput'}}}}
      responses:
        '200': {description: Lịch đã sửa, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /schedules/{scheduleId}/transitions:
    post:
      tags: [Schedules]
      operationId: transitionSchedule
      summary: Kích hoạt, tiếp tục, tạm dừng, hết hạn hoặc hủy lịch
      x-use-cases: [UC-S03, UC-S04]
      x-contract:
        purpose: Áp cạnh vòng đời lịch.
        actors: [SECURITY]
        scope: schedule.manage trên asset của lịch.
        state: Draft/Paused→Active; Active→Paused/Expired/Cancelled; Paused→Cancelled; chỉ cạnh đã duyệt.
        transaction: Lock asset/current scope then schedule; validate Active guards; update; audit; commit.
        concurrency: If-Match + idempotency.
        audit: schedule.transition from/to/reason.
        tests: [activate, pause, invalid asset, invalid edge, racing transitions]
      parameters: [{$ref: '#/components/parameters/ScheduleId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransitionInput'}}}}
      responses:
        '200': {description: Lịch sau chuyển, content: {application/json: {schema: {$ref: '#/components/schemas/Resource'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /schedules/{scheduleId}/confirm-time:
    post:
      tags: [Schedules]
      operationId: confirmScheduleTime
      summary: Owner xác nhận thời gian quét
      x-use-cases: [UC-S08]
      x-contract:
        purpose: Ghi xác nhận thời gian trước khi kích hoạt theo policy.
